version: "3.8"

services:
  backend:
    build: ./backend
    container_name: backend_app
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: frontend_app
    ports:
      - "5173:5173"

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
